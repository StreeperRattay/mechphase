training:
  epochs: 100
  batch_size: 4
  grad_accumulation: 1
  world_size: 4
  dataset_size: 720
  learning_rate: 3.0e-05
  warmup_steps: 500
  weight_decay: 1.0e-04
  momentum: 0.9
  optimizer: adamw
  schedule: cosine
  minimum_factor: 0.0
  precision: bf16
  gradient_clip: 1.0
  ema: true
  ema_decay: 0.999
  ema_warmup: 0
  log_every: 10
  evaluation_every: 1
  early_stop_patience: 0
  seed: 20260925

objective:
  classification: 1.0
  constant_phase_residual: 0.3
  tissue_mass_coupling: 0.5
  field_smoothness: 0.001
  scale_free_gauge: 0.01
  certified_only: false
  label_smoothing: 0.0
